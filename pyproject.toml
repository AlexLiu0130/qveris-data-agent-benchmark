[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qveris-data-agent-benchmark"
version = "0.1.0"
description = "Deterministic local runner and scorer for QVeris GET benchmarks"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
